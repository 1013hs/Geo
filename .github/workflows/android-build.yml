name: Android CI Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    # 直接安装Gradle，不依赖wrapper
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        
    # 生成local.properties避免警告
    - name: Create local.properties
      run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
      
    # 使用系统Gradle直接构建（绕过wrapper）
    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: GeoSurveyToolbox-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
    - name: Build Release APK
      run: gradle assembleRelease --stacktrace
      
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: GeoSurveyToolbox-Release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
